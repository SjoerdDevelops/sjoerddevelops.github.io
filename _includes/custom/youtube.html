<style>
  .iframe_wrapper {
    width: 100%;
    margin: 0 auto;
    background: #CCC;
  }
  .h_iframe {
    position: relative;
    padding-top: 56.25%; /* fallback: 16:9 for old browsers */
  }
  @supports (aspect-ratio: 16 / 9) {
    .h_iframe {
      padding-top: 0;
      aspect-ratio: 16 / 9;
    }
  }
  .h_iframe iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<div class="iframe_wrapper">
    <div class="h_iframe">
        <iframe 
            height="2"
            width="2"
            src="https://www.youtube-nocookie.com/embed/{{include.id}}"
            title="YouTube video player" 
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>
</div>
